# Builds Blade Rush on a real macOS runner. Two parallel jobs:
#   shaders  offline compile of every Metal file, assembled the way ShaderLibrary.swift does
#   app      Swift build, unit tests, headless checks, .app packaging, zipped artifact
# Runs on pushes to the Blade Rush development branch, on pull requests that touch
# BladeRush/, and on manual dispatch.
name: BladeRush macOS

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/zen-ride-6z04n9'
    paths:
      - 'BladeRush/**'
      - '.github/workflows/bladerush-macos.yml'
  pull_request:
    paths:
      - 'BladeRush/**'
      - '.github/workflows/bladerush-macos.yml'

concurrency:
  group: bladerush-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shaders:
    runs-on: macos-14
    defaults:
      run:
        working-directory: BladeRush
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || true
          xcrun -sdk macosx metal --version || true

      - name: Compile Metal shaders offline
        run: |
          OUT="$RUNNER_TEMP/msl"
          mkdir -p "$OUT"
          failed=0
          for f in Sources/BladeRush/Shaders/*.metal; do
            n="$(basename "$f" .metal)"
            [ "$n" = "Common" ] && continue
            cat Sources/BladeRush/Shaders/Common.metal "$f" > "$OUT/$n.metal"
            echo "== $n.metal"
            if ! xcrun -sdk macosx metal -std=metal3.0 -fpreserve-invariance -c "$OUT/$n.metal" -o "$OUT/$n.air"; then
              failed=1
            fi
          done
          exit $failed

  app:
    runs-on: macos-14
    defaults:
      run:
        working-directory: BladeRush
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || true
          swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Unit tests
        run: swift test

      - name: Self tests, data validation, headless fight
        run: |
          BIN="$(swift build -c release --show-bin-path)"
          "$BIN/BladeSim" selftest
          "$BIN/BladeSim" validate
          "$BIN/BladeSim" simulate gorrik 60

      - name: Package .app
        run: |
          Scripts/package.sh
          # Zip with ditto: artifact uploads drop Unix permissions, so the executable bit and
          # code signature only survive inside an archive.
          ditto -c -k --sequesterRsrc --keepParent build/BladeRush.app build/BladeRush-macOS.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: BladeRush-macOS
          path: BladeRush/build/BladeRush-macOS.zip
